# Render Blueprint - https://render.com/docs/blueprint-spec
#
# In Render: New > Blueprint > connect this repo. It reads this file and creates
# the service. You then fill in the two secret values marked sync:false.
#
# NOTE: MongoDB is NOT created here - Render doesn't offer managed MongoDB.
# Create a free cluster at MongoDB Atlas and paste its connection string
# into MONGO_URL. Full walkthrough in DEPLOY.md.

services:
  - type: web
    name: victoria-unit-flow
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore          # closest Render region to Tiruppur
    plan: free                 # change to "starter" ($7/mo) to stop it sleeping
    healthCheckPath: /api/health
    autoDeploy: true           # redeploy on git push

    envVars:
      # ---- secrets: set these in the Render dashboard, never in git ----
      - key: MONGO_URL
        sync: false            # mongodb+srv://... from Atlas
      - key: ADMIN_PASSWORD
        sync: false            # strong password for the first admin login

      # ---- generated once by Render, then kept ----
      - key: JWT_SECRET
        generateValue: true    # random 256-bit value; rotating it logs everyone out

      # ---- fixed config ----
      - key: DB_NAME
        value: victoria_unit_flow
      - key: ADMIN_EMAIL
        value: admin@victoriagarments.in
      - key: PUBLIC_MODE
        value: "true"          # refuses to boot on known-weak secrets
      - key: CORS_ORIGINS
        value: ""              # empty = same-origin only (frontend is served by this service)
      - key: PYTHON_VERSION
        value: "3.11"
